name: Bug Report
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索是否已有相同或相关问题。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 清晰简洁地描述你遇到的现象。
      placeholder: 例如：点击导出 MP4 后进度条卡在 0%。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步步说明如何复现。
      placeholder: |
        1. 打开页面
        2. 添加 N 个节点
        3. 点击「导出 MP4」
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      placeholder: Chrome 124 / Safari 17 / Firefox 125
  - type: input
    id: node
    attributes:
      label: Node 版本
      placeholder: node -v
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / 截图
      description: 粘贴控制台报错或上传截图（可拖拽至此）。

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 通过 CDN 加载 ffmpeg-core，避免 32MB wasm 触发 Cloudflare Pages 25MB 单文件上限。
      # 版本号与 package.json 中 @ffmpeg/core 保持一致（0.12.10）。
      # 如需离线本地核心，删除下面这行 env 即可（dist 会包含 wasm）。
      - name: Build
        run: pnpm build
        env:
          VITE_FFMPEG_CORE_BASE: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd"

      # 幂等建站：项目尚不存在时创建（首次部署 / 当前未部署状态），
      # 已存在则 wrangler 报错，用 continue-on-error 忽略，避免重复创建失败阻断部署。
      # 解决「当前 Cloudflare 未部署」时 wrangler pages deploy 报 Project not found 的问题。
      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        run: npx wrangler@3 pages project create story-timeline-view --production-branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=story-timeline-view --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
